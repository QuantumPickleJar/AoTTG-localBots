name: Validate experimental AoTTG2 add-on
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve M0 and check pinned API names and arity
        run: |
          python scripts/check_probe.py
          python scripts/check_traversal.py
          python scripts/check_traversal_reliable.py
          python scripts/check_wave_m2.py
          python tools/recovery_preflight.py --addons addons --persistent /tmp/empty_aottg_persistent
      - name: Test M1 control flow with mocked engine observations
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Summarize limitations
        run: echo 'PASS covers static checks and mocked control flow only. AoTTG2 parsing, physics, networking, and realism still need gameplay testing.' >> "$GITHUB_STEP_SUMMARY"
  transport-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build transport client for .NET 6 and 8
        run: dotnet build plugin/FlightRecorder.TransportClient/FlightRecorder.TransportClient.csproj --configuration Release
      - name: Exercise ordered client pipe and acknowledgments
        run: dotnet run --project tests/FlightRecorder.TransportClient.Smoke/FlightRecorder.TransportClient.Smoke.csproj --configuration Release
      - name: Exercise Windows pipe to Python writer and analyzer
        shell: pwsh
        run: ./tests/transport_windows_smoke.ps1 -PythonExe (Get-Command python).Source
      - name: Summarize transport boundary
        run: echo 'Windows named-pipe and Python writer tests use synthetic data only; no Unity or AoTTG2 runtime was exercised.' >> $env:GITHUB_STEP_SUMMARY
